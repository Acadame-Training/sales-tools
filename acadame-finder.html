<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acadame — Trainer &amp; Broker Finder</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1F3272;--navy2:#2B3F8A;--green:#16A34A;--gl:#F0FDF4;--am:#F59E0B;--al:#FFFBEB;--rd:#EF4444;--rl:#FEF2F2;--pg:#EEF2F9;--cd:#FFFFFF;--br:#E2E8F0;--bs:#CBD5E1;--tx:#0F172A;--tm:#64748B;--tl:#94A3B8;--ra:12px;--rs:8px;--sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shm:0 4px 16px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.05)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--pg);color:var(--tx);min-height:100vh;font-size:15px}
.hdr{background:var(--navy);padding:0 2rem;display:flex;align-items:center;gap:1.25rem;height:68px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr img{height:40px}
.hdv{width:1px;height:28px;background:rgba(255,255,255,.2)}
.hdt{display:flex;flex-direction:column}.hdt .n{color:#fff;font-size:14px;font-weight:600}.hdt .s{color:rgba(255,255,255,.5);font-size:11px}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.upill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px}
.tabs{background:var(--navy2);display:flex;padding:0 2rem}
.tab{color:rgba(255,255,255,.6);font-size:13.5px;font-weight:600;padding:12px 20px;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
.tab:hover{color:rgba(255,255,255,.9)}.tab.active{color:#fff;border-bottom-color:#fff}
.lay{max-width:1180px;margin:0 auto;padding:1.5rem}
.sbar{background:var(--cd);border:1px solid var(--br);border-radius:var(--ra);box-shadow:var(--shm);padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.sf{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}
.sf label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tm)}
.sw{position:relative}.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tl);pointer-events:none}
.inp{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--bs);border-radius:var(--rs);font-size:14px;font-family:inherit;color:var(--tx);background:#fff;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,50,114,.12)}
select{padding:9px 12px;border:1px solid var(--bs);border-radius:var(--rs);font-size:14px;font-family:inherit;color:var(--tx);background:#fff;cursor:pointer;min-width:190px}
select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,50,114,.12)}
.clr{padding:9px 16px;border-radius:var(--rs);border:1px solid var(--bs);background:none;color:var(--tm);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.clr:hover{background:var(--pg);color:var(--tx)}
.rmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.rc{font-size:13px;color:var(--tm);font-weight:500}.rf{font-size:11px;color:var(--tl)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
.card{background:var(--cd);border:1px solid var(--br);border-radius:var(--ra);box-shadow:var(--sh);overflow:hidden;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shm);border-color:var(--bs)}
.ch{padding:1rem 1.25rem .75rem;border-bottom:1px solid var(--br);display:flex;align-items:flex-start;gap:10px}
.av{width:38px;height:38px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:700;color:#fff}
.cn{font-size:15px;font-weight:700;color:var(--tx);line-height:1.3}.cs{font-size:12px;color:var(--tm);margin-top:2px}
.cb{padding:.875rem 1.25rem}
.ctags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.875rem}
.ct{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE}
.ct.hl{background:var(--navy);color:#fff;border-color:var(--navy)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dl{display:flex;flex-direction:column;gap:2px}
.dlb{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--tl)}
.dlv{font-size:13px;color:var(--tx);font-weight:500}.dlv.e{color:var(--tl);font-style:italic;font-weight:400}
.dp{display:inline-block;background:var(--gl);color:#166534;border:1px solid #A7F3D0;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px}
.cf{padding:.75rem 1.25rem;border-top:1px solid var(--br);background:#FAFBFD;display:flex;gap:8px}
.cb2{flex:1;padding:7px 12px;border-radius:var(--rs);font-size:12.5px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.bp{background:#EFF6FF;color:#1E40AF}.bp:hover{background:#DBEAFE}
.be{background:var(--gl);color:#166534}.be:hover{background:#DCFCE7}
.bn{background:var(--pg);color:var(--tl);cursor:default}
.empty{text-align:center;padding:4rem 2rem;color:var(--tl);grid-column:1/-1}
.empty h3{font-size:16px;color:var(--tm);font-weight:600;margin-bottom:6px}.empty p{font-size:13px}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:12px;color:var(--tm);font-size:14px}
.spin{width:32px;height:32px;border:3px solid var(--br);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:var(--rl);border:1px solid #FECACA;border-radius:var(--ra);padding:1rem 1.25rem;font-size:13px;color:var(--rd);max-width:520px;text-align:center;line-height:1.6}
.err a{color:var(--rd);font-weight:600}
.auth-s{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 68px)}
.auth-c{background:var(--cd);border:1px solid var(--br);border-radius:var(--ra);box-shadow:var(--shm);padding:2.5rem;text-align:center;max-width:420px;width:90%}
.auth-c img{height:48px;margin-bottom:1.5rem}
.auth-c h2{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:8px}
.auth-c p{font-size:14px;color:var(--tm);line-height:1.6;margin-bottom:1.5rem}
.auth-btn{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border:none;border-radius:var(--rs);padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.auth-btn:hover{background:var(--navy2)}
@media(max-width:640px){.lay{padding:1rem}.hdr{padding:0 1rem}.tabs{padding:0 1rem}.sbar{flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>

      <div class="rmeta"><span class="rc" id="pc2"></span><span class="rf" id="pf"></span></div>
      <div class="grid" id="pg"></div>
    </div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const CLIENT_ID = "8c726285-27a0-417a-97f4-18e7bc2fae1a";
const TENANT    = "acadame.sharepoint.com";
const SITE      = "Sales94";
const LIBRARY   = "Shared Documents";
const FOLDER    = "Sales Tool Data";
const FILE      = "acadame-database.xlsx";
const SCOPES    = ["Files.Read","Sites.Read.All","User.Read"];

// ── Auth state ────────────────────────────────────────────────────────────────
let accessToken = null;
let trainers = [], partners = [], loadedAt = null;

const el = id => document.getElementById(id);

function show(id) {
  ["auth-s","loading-s","error-s","main"].forEach(s => {
    el(s).style.display = s === id ? (id==="auth-s"?"flex":"block") : "none";
  });
  el("tabs").style.display = id==="main" ? "flex" : "none";
}

// ── PKCE Auth Code Flow (no library needed) ───────────────────────────────────
function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
}

async function generatePKCE() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  const challenge = b64url(hash);
  return { verifier, challenge };
}

async function doSignIn() {
  try {
    const { verifier, challenge } = await generatePKCE();
    const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
    sessionStorage.setItem("pkce_verifier", verifier);
    sessionStorage.setItem("pkce_state", state);
    sessionStorage.setItem("redirect_back", window.location.href.split("?")[0].split("#")[0]);

    const params = new URLSearchParams({
      client_id:             CLIENT_ID,
      response_type:         "code",
      redirect_uri:          window.location.href.split("?")[0].split("#")[0],
      scope:                 SCOPES.join(" ") + " offline_access",
      code_challenge:        challenge,
      code_challenge_method: "S256",
      state:                 state,
      response_mode:         "query",
    });

    window.location.href = `https://login.microsoftonline.com/common/oauth2/v2.0/authorize?${params}`;
  } catch(e) {
    showErr("Sign-in failed: " + e.message);
  }
}

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code  = params.get("code");
  const state = params.get("state");
  const error = params.get("error");

  if (error) {
    showErr("Sign-in error: " + params.get("error_description"));
    return false;
  }
  if (!code) return false;

  const savedState    = sessionStorage.getItem("pkce_state");
  const verifier      = sessionStorage.getItem("pkce_verifier");
  const redirectUri   = sessionStorage.getItem("redirect_back") || window.location.href.split("?")[0].split("#")[0];

  if (state !== savedState) { showErr("State mismatch — please try signing in again."); return false; }

  show("loading-s"); el("load-msg").textContent = "Completing sign-in…";

  try {
    const body = new URLSearchParams({
      client_id:     CLIENT_ID,
      grant_type:    "authorization_code",
      code:          code,
      redirect_uri:  redirectUri,
      code_verifier: verifier,
    });

    const res  = await fetch("https://login.microsoftonline.com/common/oauth2/v2.0/token", {
      method:  "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body:    body.toString(),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error_description || data.error);

    accessToken = data.access_token;
    if (data.refresh_token) sessionStorage.setItem("refresh_token", data.refresh_token);

    // Decode name from id_token
    try {
      const payload = JSON.parse(atob(data.id_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
      el("upill").textContent = payload.name || payload.preferred_username || "";
      el("upill").style.display = "inline-block";
    } catch(e) {}

    // Clean URL
    window.history.replaceState({}, "", redirectUri);
    sessionStorage.removeItem("pkce_verifier");
    sessionStorage.removeItem("pkce_state");
    return true;
  } catch(e) {
    showErr("Token exchange failed: " + e.message);
    return false;
  }
}

async function refreshToken() {
  const rt = sessionStorage.getItem("refresh_token");
  if (!rt) return false;
  try {
    const body = new URLSearchParams({
      client_id:     CLIENT_ID,
      grant_type:    "refresh_token",
      refresh_token: rt,
      scope:         SCOPES.join(" ") + " offline_access",
    });
    const res  = await fetch("https://login.microsoftonline.com/common/oauth2/v2.0/token", {
      method:  "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body:    body.toString(),
    });
    const data = await res.json();
    if (data.error) return false;
    accessToken = data.access_token;
    if (data.refresh_token) sessionStorage.setItem("refresh_token", data.refresh_token);
    return true;
  } catch(e) { return false; }
}

// ── Graph ─────────────────────────────────────────────────────────────────────
async function graph(url) {
  const res = await fetch("https://graph.microsoft.com/v1.0" + url, {
    headers: { Authorization: "Bearer " + accessToken }
  });
  if (res.status === 401) {
    const ok = await refreshToken();
    if (ok) return graph(url);
    show("auth-s"); throw new Error("Session expired — please sign in again.");
  }
  if (!res.ok) throw new Error(`Graph ${res.status}: ${await res.text()}`);
  return res.json();
}

async function loadData() {
  show("loading-s");
  try {
    el("load-msg").textContent = "Finding SharePoint site…";
    const site  = await graph(`/sites/${TENANT}:/sites/${SITE}`);
    el("load-msg").textContent = "Locating document library…";
    const drives = await graph(`/sites/${site.id}/drives`);
    const drive  = drives.value.find(d => d.name === LIBRARY || d.name === "Documents");
    if (!drive) throw new Error(`Library "${LIBRARY}" not found. Available: ${drives.value.map(d=>d.name).join(", ")}`);
    el("load-msg").textContent = "Loading Excel file…";
    const file   = await graph(`/drives/${drive.id}/root:/${FOLDER}/${FILE}`);
    el("load-msg").textContent = "Reading trainer data…";
    const tRows  = await graph(`/drives/${drive.id}/items/${file.id}/workbook/worksheets/Trainer Search/usedRange`);
    el("load-msg").textContent = "Reading broker data…";
    const pRows  = await graph(`/drives/${drive.id}/items/${file.id}/workbook/worksheets/Broker & Partner Search/usedRange`);
    trainers  = parseSheet(tRows, "trainer");
    partners  = parseSheet(pRows, "partner");
    loadedAt  = new Date();
    el("hdr-s").textContent = "Updated " + loadedAt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    show("main");
    renderT(); renderP();
  } catch(e) { showErr(e.message); }
}

function parseSheet(r, type) {
  const rows = r.values; if (!rows||rows.length<9) return [];
  const hdrs = rows[7].map(h=>String(h||"").trim().toLowerCase());
  const out  = [];
  for (let i=8;i<rows.length;i++) {
    const row=rows[i]; if (!row[0]||!String(row[0]).trim()) continue;
    const o={}; hdrs.forEach((h,ci)=>{ o[h]=String(row[ci]??"").trim()||""; });
    if (type==="trainer") out.push({name:o.name,phone:o.phone,email:o.email,
      courses:o["courses delivered"]?o["courses delivered"].split(",").map(s=>s.trim()).filter(Boolean):[],
      area:o["region / area"]||"",dailyRate:o["day rate"]||"",halfDayRate:o["half day"]||"",
      mileage:o.mileage||"",paymentTerms:o["payment terms"]||"",virtualDelivery:o["virtual?"]||""});
    else out.push({name:o["company name"]||o.name,phone:o.phone,email:o.email,discount:o.discount,
      courses:o["courses offered"]?o["courses offered"].split(",").map(s=>s.trim()).filter(Boolean):[],
      paymentTerms:o["payment terms"]||""});
  }
  return out;
}

function showErr(msg) { el("err-msg").innerHTML="<strong>Something went wrong</strong><br>"+msg; show("error-s"); }

// ── Render ────────────────────────────────────────────────────────────────────
function initials(n){return(n||"?").split(" ").slice(0,2).map(w=>w[0]||"").join("").toUpperCase()}
function hl(t,q){if(!q||!t)return t||"";const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");return String(t).replace(re,"<mark style='background:#FEF08A;border-radius:2px;padding:0 1px'>$1</mark>")}

function renderT(){
  const q=el("tq").value.trim().toLowerCase(),cf=el("tc").value,rf=el("tr").value;
  const res=trainers.filter(t=>{
    const mq=!q||[t.name,...t.courses,t.area,t.phone,t.email,t.dailyRate,t.paymentTerms].join(" ").toLowerCase().includes(q);
    const mc=!cf||t.courses.includes(cf);
    const mr=!rf||(t.area||"").toLowerCase().includes(rf.toLowerCase());
    return mq&&mc&&mr;
  });
  el("tc2").textContent=res.length+" trainer"+(res.length!==1?"s":"")+" found";
  el("tf").textContent=loadedAt?"Data loaded "+loadedAt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"";
  if(!res.length){el("tg").innerHTML='<div class="empty"><h3>No trainers found</h3><p>Try a different keyword or remove a filter</p></div>';return;}
  el("tg").innerHTML=res.map(t=>{
    const tags=t.courses.map(c=>`<span class="ct ${cf===c?"hl":""}">${hl(c,q)}</span>`).join("");
    const rate=[t.dailyRate&&`Day: ${t.dailyRate}`,t.halfDayRate&&`Half: ${t.halfDayRate}`].filter(Boolean).join(" · ")||null;
    const pb=t.phone?`<a class="cb2 bp" href="tel:${t.phone}">${t.phone}</a>`:`<span class="cb2 bn">No phone</span>`;
    const eb=t.email?`<a class="cb2 be" href="mailto:${t.email}">Email</a>`:`<span class="cb2 bn">No email</span>`;
    return `<div class="card"><div class="ch"><div class="av">${initials(t.name)}</div><div><div class="cn">${hl(t.name,q)}</div>${t.area?`<div class="cs">${hl(t.area,q)}</div>`:""}</div></div><div class="cb"><div class="ctags">${tags||'<span style="font-size:12px;color:var(--tl)">No courses listed</span>'}</div><div class="dg"><div class="dl"><span class="dlb">Rate</span><span class="dlv ${rate?"":"e"}">${rate||"Not listed"}</span></div><div class="dl"><span class="dlb">Mileage</span><span class="dlv ${t.mileage?"":"e"}">${t.mileage||"Not listed"}</span></div><div class="dl"><span class="dlb">Payment</span><span class="dlv ${t.paymentTerms?"":"e"}">${t.paymentTerms||"Not listed"}</span></div></div></div><div class="cf">${pb}${eb}</div></div>`;
  }).join("");
}

function renderP(){
  const q=el("pq").value.trim().toLowerCase(),cf=el("pc").value;
  const res=partners.filter(p=>{
    const mq=!q||[p.name,...p.courses,p.phone,p.email,p.discount].join(" ").toLowerCase().includes(q);
    const mc=!cf||p.courses.includes(cf);
    return mq&&mc;
  });
  el("pc2").textContent=res.length+" partner"+(res.length!==1?"s":"")+" found";
  el("pf").textContent=loadedAt?"Data loaded "+loadedAt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"";
  if(!res.length){el("pg").innerHTML='<div class="empty"><h3>No partners found</h3><p>Try a different keyword or remove a filter</p></div>';return;}
  el("pg").innerHTML=res.map(p=>{
    const tags=p.courses.map(c=>`<span class="ct ${cf===c?"hl":""}">${hl(c,q)}</span>`).join("");
    const pb=p.phone?`<a class="cb2 bp" href="tel:${p.phone}">${p.phone}</a>`:`<span class="cb2 bn">No phone</span>`;
    const eb=p.email?`<a class="cb2 be" href="mailto:${p.email}">Email</a>`:`<span class="cb2 bn">No email</span>`;
    return `<div class="card"><div class="ch"><div class="av">${initials(p.name)}</div><div style="flex:1;min-width:0"><div class="cn">${hl(p.name,q)}</div>${p.discount?`<div class="cs" style="margin-top:4px"><span class="dp">&#9660; ${p.discount} discount</span></div>`:""}</div></div><div class="cb"><div class="ctags">${tags||'<span style="font-size:12px;color:var(--tl)">No courses listed</span>'}</div><div class="dg"><div class="dl"><span class="dlb">Payment</span><span class="dlv ${p.paymentTerms?"":"e"}">${p.paymentTerms||"Not listed"}</span></div></div></div><div class="cf">${pb}${eb}</div></div>`;
  }).join("");
}

function showTab(t){
  el("v-t").style.display=t==="t"?"block":"none";
  el("v-p").style.display=t==="p"?"block":"none";
  el("tab-t").classList.toggle("active",t==="t");
  el("tab-p").classList.toggle("active",t==="p");
}
function clearT(){el("tq").value="";el("tc").value="";el("tr").value="";renderT();}
function clearP(){el("pq").value="";el("pc").value="";renderP();}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  // Check if returning from auth redirect
  if (window.location.search.includes("code=")) {
    const ok = await handleCallback();
    if (ok) { await loadData(); return; }
  }
  // Check for existing refresh token
  if (sessionStorage.getItem("refresh_token")) {
    const ok = await refreshToken();
    if (ok) { await loadData(); return; }
  }
  show("auth-s");
}

init();
</script>
